<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Exams</title>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Arial', sans-serif;
        }
        .container {
            max-width: 800px;
            margin-top: 50px;
            margin-left: auto; /* 水平居中 */
    margin-right: auto; /* 水平居中 */
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #343a40;
            margin-bottom: 30px;
        }
        .exam-list {
            list-style-type: none; /* 去掉默认的列表样式 */
            padding: 0;
        }
        .exam-list li {
            background-color: #e9ecef; /* 浅灰色背景 */
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #dee2e6; /* 边框 */
        }
        .exam-list a {
            color: #457345; /* 链接颜色 */
            text-decoration: none; /* 去掉下划线 */
            font-weight: bold;
        }
        .exam-list a:hover {
            text-decoration: underline; /* 鼠标悬停时显示下划线 */
        }
        .exam-time {
            color: #6c757d; /* 时间文字颜色 */
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Available Exams</h1>
        <ul class="exam-list">
            {% for exam in exams %}
                <li>
                    <a href="{% url 'accessment:start_exam' exam.unit_id %}">{{ exam.title }}</a>
                    <span class="exam-time"> - {{ exam.start_time }} to {{ exam.end_time }}</span>
                <span class="exam-time-remaining-js" data-start="{{ exam.start_timestamp }}" data-current="{{ exam.current_timestamp }}"></span>
                </li>
            {% endfor %}
        </ul>
    </div>
<script>
    document.querySelectorAll('.exam-time-remaining-js').forEach(span => {
        const startTimestamp = parseFloat(span.getAttribute('data-start'));
        const currentTimestamp = parseFloat(span.getAttribute('data-current'));

        function updateCountdown() {
            const now = Date.now() / 1000; // 当前时间戳（秒）
            const remainingTime = startTimestamp - now; // 剩余时间（秒）

            if (remainingTime < 0) {
                span.textContent = '考试已开始';
                clearInterval(intervalId); // 停止更新
                return;
            }

            // 计算小时、分钟和秒
            const hours = Math.floor(remainingTime / 3600);
            const minutes = Math.floor((remainingTime % 3600) / 60);
            const seconds = Math.floor(remainingTime % 60);

            // 格式化为两位数显示
            const formattedHours = hours.toString().padStart(2, '0');
            const formattedMinutes = minutes.toString().padStart(2, '0');
            const formattedSeconds = seconds.toString().padStart(2, '0');

            span.textContent = `${formattedHours}小时${formattedMinutes}分钟${formattedSeconds}秒`;
        }

        // 每秒更新一次倒计时
        const intervalId = setInterval(updateCountdown, 1000);
        updateCountdown(); // 立即更新一次
    });
</script>
</body>
</html>
