<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Information</title>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Arial', sans-serif;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
            margin-left: auto; /* 水平居中 */
    margin-right: auto; /* 水平居中 */
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #343a40;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            font-weight: bold;
        }
        /* 自定义按钮样式 */
        .custom-btn {
            background-color: #6dac6d;
            color: white; 
            border: none; 
            padding: 10px 20px; 
            text-align: center;
            text-decoration: none;
            display: inline-block; 
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 6px;
            transition: background-color 0.3s ease;
        }
        .custom-btn:hover {
            background-color: #457345; /* 鼠标悬停时的背景颜色 */
        }

        .button-container {
            text-align: center; /* 按钮居中 */
            margin-top: 20px; /* 添加一些顶部间距 */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Confirm Your Information</h1>
        <form method="post" action="{% url 'accessment:confirm_info' %}" class="form">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username:</label>
                <p id="username">{{ student.username }}</p>
            </div>
            <div class="form-group">
                <label for="name">Name:</label>
                <p id="name">{{ student.name }}</p>
            </div>
            <div class="form-group">
                <label for="class">Class:</label>
                <p id="class">{{ class_instance.class_name }}</p>
            </div>

            <div class="form-group">
                <label for="year">Year:</label>
                <p id="year">{{ course.year }}</p>
            </div>
            <div class="form-group">
                <label for="grade">Grade:</label>
                <p id="grade">{{ course.get_grade_display }}</p>
            </div>
            <div class="form-group">
                <label for="semester">Semester:</label>
                <p id="semester">{{ course.get_semester_display }}</p>
            </div>
            <div class="form-group">
                <label for="teacher">Teacher:</label>
                <p id="teacher">{{ teacher.name }}</p>
            </div>
            <div class="button-container">
                <button type="submit" class="custom-btn">Confirm</button>
                <p>If you have any questions, contact the teacher.</p>
            </div>
            
        </form>
    </div>
   </body>
</html>
