<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Exams</title>
    <style>
        body {
            background-color: #F9F8F3;
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Arial', sans-serif;
            color: #1A1A1A;
        }
        .container {
            max-width: 800px;
            margin-top: 50px;
            margin-left: auto;
            margin-right: auto;
            padding: 40px;
            background-color: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #99B6B4, #BACFCE, #D48982, #DFB199);
        }

        .container::after {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(153, 182, 180, 0.08), transparent);
            border-radius: 50%;
        }

        h1 {
            text-align: center;
            color: #1A1A1A;
            margin-bottom: 30px;
            font-size: 36px;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #99B6B4, #D48982);
            border-radius: 2px;
        }

        .exam-list {
            list-style-type: none;
            padding: 0;
            position: relative;
            z-index: 1;
        }
        .exam-list li {
            background-color: rgba(186, 207, 206, 0.1);
            padding: 18px 20px;
            margin-bottom: 12px;
            border-radius: 12px;
            border: 1px solid #BACFCE;
            border-left: 4px solid #99B6B4;
            transition: all 0.3s ease;
        }
        .exam-list li:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
            transform: translateY(-3px);
            background-color: rgba(186, 207, 206, 0.15);
            border-left-color: #D48982;
        }
        .exam-list a {
            color: #1A1A1A;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
        }
        .exam-list a:hover {
            color: #99B6B4;
        }
        .exam-time {
            color: #666;
            font-size: 0.9em;
            margin-left: 8px;
        }
        .exam-time-remaining-js {
            color: #D48982;
            font-weight: 500;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Available Exams</h1>
        <ul class="exam-list">
            {% for exam in exams %}
                <li>
                    <a href="{% url 'accessment:start_exam' exam.unit_id %}">{{ exam.title }}</a>
                    <span class="exam-time"> - {{ exam.start_time }} to {{ exam.end_time }}</span>
                <span class="exam-time-remaining-js" data-start="{{ exam.start_timestamp }}" data-current="{{ exam.current_timestamp }}"></span>
                </li>
            {% endfor %}
        </ul>
    </div>
<script>
    document.querySelectorAll('.exam-time-remaining-js').forEach(span => {
        const startTimestamp = parseFloat(span.getAttribute('data-start'));
        const currentTimestamp = parseFloat(span.getAttribute('data-current'));

        function updateCountdown() {
            const now = Date.now() / 1000; // 当前时间戳（秒）
            const remainingTime = startTimestamp - now; // 剩余时间（秒）

            if (remainingTime < 0) {
                span.textContent = '考试已开始';
                clearInterval(intervalId); // 停止更新
                return;
            }

            // 计算小时、分钟和秒
            const hours = Math.floor(remainingTime / 3600);
            const minutes = Math.floor((remainingTime % 3600) / 60);
            const seconds = Math.floor(remainingTime % 60);

            // 格式化为两位数显示
            const formattedHours = hours.toString().padStart(2, '0');
            const formattedMinutes = minutes.toString().padStart(2, '0');
            const formattedSeconds = seconds.toString().padStart(2, '0');

            span.textContent = `${formattedHours}小时${formattedMinutes}分钟${formattedSeconds}秒`;
        }

        // 每秒更新一次倒计时
        const intervalId = setInterval(updateCountdown, 1000);
        updateCountdown(); // 立即更新一次
    });
</script>
</body>
</html>
