{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>私聊</title>
        <link rel="stylesheet" href="{% static 'css/forum_student.css' %}">
    <style>
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 16px;
            font-weight: bold;
        }
                a {
            color: #4CAF50;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .public{
            color: #706f6f;
        }
        .nonpublic{
            color: #fb0000;
        }
    </style>

</head>
<body>
 {% for post in posts %}
     <div class="card mb-3">
            <h4 class="card-title">{{ post.title }}</h4>
     <div class="card-body">

    <p>{{ post.content }}</p>

                            <p class="card-text">By: {{ post.name }}</p>
                            <p class="card-text">{{ post.created_at|date:"Y/m/d H:i" }}</p>
<a href="{% url 'forum:post_detail' post.id %}">CHECK</a>
     {% if post.is_public %}
            <a href="{% url 'forum:change_public' post.id %}" class="nonpublic">隐藏</a>
        {% else %}
            <a href="{% url 'forum:change_public' post.id %}" class="public">设为公开</a>
        {% endif %}
      </div>
      </div>
    {% endfor %}
 <div class="back-link">
        <a href="{% url 'forum:forum' %}">Back to Forum</a>
    </div>
</body>
</html>
