<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>录入听力题目</title>
</head>
<body>
    <h1>录入听力题目</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <h2>大题表单</h2>
        {{ main_form.as_p }}

        <h2>小题表单</h2>
        {{ sub_form.as_p }}

        <h2>连线选项表单</h2>
        {{ formset.management_form }}
        {% for form in formset %}
            <div style="border: 1px solid #ccc; padding: 10px; margin-bottom: 10px;">
                {{ form.as_p }}
            </div>
        {% endfor %}

        <button type="submit">提交</button>
    </form>
</body>
</html>
