<h2>创建大题及小题new</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <h3>大题信息</h3>
    {{ big_question_form.as_p }}

    <h3>小题信息</h3>
    <div id="small-questions-container">
        {{ small_question_formset.management_form }}
        {% for form in small_question_formset.forms %}
            <div class="small-question-form" id="form-{{ forloop.counter0 }}">
                {{ form.as_p }}
                <button type="button" class="delete-form-btn" data-form-index="{{ forloop.counter0 }}">删除</button>
            </div>
        {% endfor %}
    </div>

    <button type="button" id="add-form-btn">添加小题</button>
    <button type="submit">保存</button>
</form>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const managementForm = document.querySelector('input[name="sub_questions-TOTAL_FORMS"]');
    // 添加小题
    document.getElementById('add-form-btn').addEventListener('click', function() {
        const totalForms = parseInt(managementForm.value, 10);

        // 克隆第一个表单
        const newForm = document.querySelector('.small-question-form').cloneNode(true);
        newForm.id = `form-${totalForms}`;

        // 更新表单中的所有输入字段的 name 和 id
        newForm.querySelectorAll('input, select, textarea').forEach(function(input) {
            const name = input.name.replace('-0-', `-${totalForms}-`);
            const id = input.id.replace('-0-', `-${totalForms}-`);
            input.name = name;
            input.id = id;
            input.value = '';  // 清空输入值
        });
        //更新label
        newForm.querySelectorAll('label').forEach(function(label){
            const for_value = label.getAttribute('for').replace('-0-', `-${totalForms}-`);
            label.setAttribute('for', for_value)
        })

        // 更新删除按钮的 data-form-index
        newForm.querySelector('.delete-form-btn').dataset.formIndex = totalForms;

        // 插入新的表单
        document.getElementById('small-questions-container').appendChild(newForm);

        // 更新管理表单的总表单数
        managementForm.value = totalForms + 1;
    });

    // 删除小题
    document.getElementById('small-questions-container').addEventListener('click', function(event) {
        if (event.target.classList.contains('delete-form-btn')) {
            const formIndex = event.target.dataset.formIndex;
            const formToDelete = document.getElementById(`form-${formIndex}`);
            if (formToDelete) {
                formToDelete.remove();

                // 更新管理表单的总表单数
                managementForm.value = parseInt(managementForm.value, 10) - 1;

                // 重新编号剩余的表单
                const forms = document.querySelectorAll('.small-question-form');
                forms.forEach((form, index) => {
                    form.id = `form-${index}`;
                    form.querySelectorAll('input, select, textarea').forEach(input => {
                        const name = input.name.replace(/-\d+-/, `-${index}-`);
                        const id = input.id.replace(/-\d+-/, `-${index}-`);
                        input.name = name;
                        input.id = id;
                    });
                    form.querySelector('.delete-form-btn').dataset.formIndex = index;

                    //更新label
                    form.querySelectorAll('label').forEach(function(label){
                    const for_value = label.getAttribute('for').replace(/-\d+-/, `-${index}-`);
                    console.log(for_value)
                    label.setAttribute('for', for_value)
                })
                });

            } else {
                console.error('要删除的表单未找到');
            }
        }
    });
});
</script>
