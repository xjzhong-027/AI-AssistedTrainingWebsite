<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
    <style>
        body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f8f9fa;
    color: #333;
    line-height: 1.6;
}

.container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
    background-color: #fff;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    margin-top: 20px;
}

h2 {
    color: #333;
    border-bottom: 2px solid #4CAF50;
    padding-bottom: 10px;
    margin-bottom: 20px;
}

.announcement-content {
    margin-bottom: 20px;
    line-height: 1.8;
}

.btn {
    padding: 10px 20px;
    border-radius: 4px;
    font-weight: 500;
    transition: all 0.3s;
    margin-right: 10px;
}

.btn-primary {
    background-color: #4CAF50;
    border-color: #4CAF50;
    color: white;
}

.btn-primary:hover {
    background-color: #45a049;
    border-color: #45a049;
}

.btn-secondary {
    background-color: #6c757d;
    border-color: #6c757d;
    color: white;
}

.btn-secondary:hover {
    background-color: #5a6268;
    border-color: #5a6268;
}

form {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
}

label {
    margin-right: 10px;
    font-weight: 500;
}

input[type="number"] {
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
    margin-right: 10px;
    width: 100px;
}

button[type="submit"] {
    margin-top: 10px;
    width: auto;
}

@media (max-width: 768px) {
    form {
        flex-direction: column;
    }

    label, input, button {
        width: 100%;
        margin-bottom: 10px;
    }
}
    </style>
</head>
<body>
<div class="container mt-4">
    <h2>{{ announcement.a_title }}</h2>
    <p>发布于: {{ announcement.created_at|date:"Y-m-d H:i" }}</p>
    <div class="announcement-content">
      {{ announcement.a_content|linebreaksbr }}
    </div>

 <a href="{% url 'forum:post_new' %}?announcement_id={{ announcement.id }}&preset_title=Question on《{{ announcement.a_title }}》" class="btn btn-primary">
     Ask Question</a>
    <div>
<form action="{% url 'announce:reminder' announcement_id=announcement.id %}" method="post" style="display:inline;">
    {% csrf_token %}
    <label for="reminder_minutes">稍后提醒（min）:</label>
    <input type="number" id="reminder_minutes" name="reminder_minutes" min="1" required>
    <button type="submit" class="btn btn-secondary">稍后提醒</button>
</form>
    </div>

</div>

<script>
    var ws_scheme = window.location.protocol === "https:" ? "wss" : "ws";
    var ws_path = ws_scheme + '://' + window.location.host + '/ws/notifications/';
    var socket = new WebSocket(ws_path);

    socket.onopen = function(e) {
        console.log('WebSocket is open now.');
    };

    socket.onmessage = function(e) {
        console.log('Message from server ', e.data);
        // 解析服务器发送的消息
        var message = JSON.parse(e.data).message;
        console.log('New message:', message);

        // 将消息添加到页面上
        var messagesContainer = document.getElementById('notifications');
        if (messagesContainer) {
            var newMessage = document.createElement('div');
            newMessage.textContent = message;
            messagesContainer.appendChild(newMessage);
        }
    };

    socket.onclose = function(e) {
        console.log('WebSocket is closed now.');
    };

    socket.onerror = function(e) {
        console.error('WebSocket error observed:', e);
    };
</script>
</body>
</html>
