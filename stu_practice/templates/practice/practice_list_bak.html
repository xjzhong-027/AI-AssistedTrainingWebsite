<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Practices</title>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Arial', sans-serif;
        }
        .container {
            max-width: 800px;
            margin-top: 50px;
            margin-left: auto;
            margin-right: auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #343a40;
            margin-bottom: 30px;
        }
        .practice-list {
            list-style-type: none;
            padding: 0;
        }
        .practice-list li {
            background-color: #e9ecef;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #dee2e6;
        }
        .practice-list a {
            color: #457345;
            text-decoration: none;
            font-weight: bold;
        }
        .practice-list a:hover {
            text-decoration: underline;
        }
        .practice-time {
            color: #6c757d;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Available Practices</h1>
        <ul class="practice-list">
            {% for practice in practices %}
                <li>
                    <a href="{% url 'stu_practice:start_practice' practice.unit_id %}">{{ practice.title }}</a>
                    <span class="practice-time"> - {{ practice.start_time }} to {{ practice.end_time }}</span>
                <span class="practice-time-remaining-js" data-start="{{ practice.start_timestamp }}" data-current="{{ practice.current_timestamp }}"></span>
                </li>
            {% endfor %}
        </ul>
    </div>
<script>
    document.querySelectorAll('.practice-time-remaining-js').forEach(span => {
        const startTimestamp = parseFloat(span.getAttribute('data-start'));
        const currentTimestamp = parseFloat(span.getAttribute('data-current'));

        function updateCountdown() {
            const now = Date.now() / 1000; // 当前时间戳（秒）
            const remainingTime = startTimestamp - now; // 剩余时间（秒）

            if (remainingTime < 0) {
                span.textContent = '练习已开始';
                clearInterval(intervalId); // 停止更新
                return;
            }

            // 计算小时、分钟和秒
            const hours = Math.floor(remainingTime / 3600);
            const minutes = Math.floor((remainingTime % 3600) / 60);
            const seconds = Math.floor(remainingTime % 60);

            // 格式化为两位数显示
            const formattedHours = hours.toString().padStart(2, '0');
            const formattedMinutes = minutes.toString().padStart(2, '0');
            const formattedSeconds = seconds.toString().padStart(2, '0');

            span.textContent = `${formattedHours}小时${formattedMinutes}分钟${formattedSeconds}秒`;
        }

        // 每秒更新一次倒计时
        const intervalId = setInterval(updateCountdown, 1000);
        updateCountdown(); // 立即更新一次
    });
</script>
</body>
</html>
